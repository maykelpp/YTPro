plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.ytpro.local'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ytpro.local'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17'; freeCompilerArgs += ['-Xskip-metadata-version-check'] }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', '/META-INF/{AL2.0,LGPL2.1}'] }
    }
}
dependencies {
    // Version de la libreria: si hay una mas nueva en Maven Central, cambia este numero y vuelve a compilar
    // (asi se actualiza yt-dlp cuando YouTube cambia algo).
    def ytdl = '0.18.1'
    implementation "io.github.junkfood02.youtubedl-android:library:$ytdl"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$ytdl"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
