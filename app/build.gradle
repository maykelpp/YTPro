plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// El numero de compilacion de GitHub sube solo en cada build: asi Android acepta la actualizacion encima.
def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
android {
    namespace 'com.ytpro.local'
    compileSdk 35
    signingConfigs {
        // Clave FIJA (app/ytpro.p12): misma firma en todas las versiones = se actualiza sin desinstalar.
        // No la borres ni la cambies. Mantén el repositorio PRIVADO.
        ytpro {
            storeFile file('ytpro.p12')
            storePassword 'ytpro-2026'
            keyAlias 'ytpro'
            keyPassword 'ytpro-2026'
            storeType 'pkcs12'
        }
    }
    defaultConfig {
        applicationId 'com.ytpro.local'
        minSdk 29
        targetSdk 34
        versionCode run
        versionName "2.1.${run}"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.ytpro }
        release { signingConfig signingConfigs.ytpro; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17'; freeCompilerArgs += ['-Xskip-metadata-version-check'] }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', '/META-INF/{AL2.0,LGPL2.1}'] }
    }
}
dependencies {
    // Si hay una version mas nueva en Maven Central, cambia este numero y vuelve a compilar (actualiza yt-dlp).
    def ytdl = '0.18.1'
    implementation "io.github.junkfood02.youtubedl-android:library:$ytdl"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$ytdl"
    implementation "io.github.junkfood02.youtubedl-android:aria2c:$ytdl"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
