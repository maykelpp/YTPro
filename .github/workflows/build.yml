name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - name: Nombrar el APK con su numero de version
        run: cp app/build/outputs/apk/debug/app-debug.apk YTPro-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YTPro-${{ github.run_number }}
          path: YTPro-${{ github.run_number }}.apk
      - name: Publicar en Releases (descarga directa del .apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: YT Pro v${{ github.run_number }}
          files: YTPro-${{ github.run_number }}.apk
